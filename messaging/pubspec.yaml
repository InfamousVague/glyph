name: ghost_messaging
description: "Ghost Messaging: an SMS and MMS app for Android, drawn with Glacier (Ghost.md's UI kit)."
publish_to: 'none'
version: 0.10.4+115

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # The Glacier UI kit in Flutter, vendored from Ghost.md by way of Ghost Keyboard (packages/glacier/VENDORED.md).
  glacier:
    path: packages/glacier
  pointycastle: ^4.0.0
  qr: ^4.0.1
  # Voice and video channels and group calls (lib/voice; Matt, 2026-11-14: "jump in audio chats like discord has
  # always open voice channels"): WebRTC, the sound and picture going between the phones directly.
  flutter_webrtc: 1.6.3
  # TDLib's C functions for the Telegram inbox (lib/inbox/td_json.dart): Dart's own FFI helpers, already in the lock.
  ffi: ^2.1.0
  # The video player on the phone (lib/ui/video_screen.dart; Matt, 2026-11-15: "id like a video player built with
  # glacier UI right now it looks like a very old android core system player"): ExoPlayer under the app's own controls.
  video_player: ^2.14.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_android_video: ^1.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Starts the real Mac app and drives it against a phone on an emulator (integration_test/desk_live_test.dart).
  integration_test:
    sdk: flutter
  # The relay itself, so the Mac's link is tested through the real one (test/desk_link_test.dart).
  ghost_relay:
    path: relay
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: false
  assets:
    # Ghost.md's stylesheets, read by the token engine over Glacier's own (lib/main.dart).
    - assets/css/ink.css
    - assets/css/app.css
    # Overlays that play in place of a drawn effect, where one has been added (docs/effects.md).
    - assets/effects/
    # The sticker packs, made from the effects' ghost by tool/sticker_packs.py (lib/stickers.dart).
    - assets/stickers/ghost/
    - assets/stickers/love/
    - assets/stickers/party/
    - assets/stickers/sweet/
    - assets/stickers/mischief/
    # The walkthrough's voice, ElevenLabs' at build time (tool/onboarding_voice.py, lib/onboarding/narration.dart).
    - assets/onboarding/
    # The app's own mark, cut from its icon (tool/app_icon.py).
    - assets/art/
    # The interface sounds, made by tool/ui_sounds.py (lib/sounds.dart).
    - assets/sounds/
    # Every emoji with its names, keywords and skin tones, for the app's own picker (lib/emoji_data.dart; emojibase,
    # MIT, assets/emoji/LICENSE-emojibase).
    - assets/emoji/emoji.tsv
  fonts:
    - family: Inter Variable
      fonts:
        - asset: assets/fonts/InterVariable-latin.ttf
    - family: JetBrains Mono Variable
      fonts:
        - asset: assets/fonts/JetBrainsMonoVariable-latin.ttf
    # The look Dial-Up's face (lib/looks.dart): Arial's metrics, under the OFL (assets/fonts/OFL-Arimo.txt).
    - family: Arimo
      fonts:
        - asset: assets/fonts/ArimoVariable.ttf
    # The emoji sets the person chooses between (lib/emoji_sets.dart, assets/emoji/LICENSES.md).
    - family: Ghost Emoji Noto
      fonts:
        - asset: assets/emoji/NotoColor.ttf
    - family: Ghost Emoji Twemoji
      fonts:
        - asset: assets/emoji/Twemoji.ttf
    - family: Ghost Emoji OpenMoji
      fonts:
        - asset: assets/emoji/OpenMoji.ttf
    - family: Ghost Emoji Outline
      fonts:
        - asset: assets/emoji/NotoOutline.ttf
