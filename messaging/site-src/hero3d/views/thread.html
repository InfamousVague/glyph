<!-- The outer screen: one conversation, as a screen this short shows it under the row its camera sits in. It plays

     receipt, the next message and the reactions are layers that start empty or away, and site/mock/hero.js fills
     them when site/hero3d.js says to (each a piece of the app drawn by the kit; site/mock/hero.css gives it its box). -->
