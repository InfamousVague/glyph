# Ghost.md for Windows: the installer, built on a Windows runner (docs/DESIGN.md §208).
#
# The Mac app and the APK are built on Matt's Mac by scripts/deploy-ota.mjs; a Mac cannot build the Windows app (the
# speech and language engines are C++ built with MSVC), so this does, by hand (Run workflow) or on a push to the
# `windows` branch. What it makes is the NSIS installer as an artifact; scripts/deploy-windows.mjs fetches it and puts
# it on the site. Signed only where the repository holds a certificate (WINDOWS_CERTIFICATE, a base64 .pfx, and
# WINDOWS_CERTIFICATE_PASSWORD): without one the installer is unsigned and Windows asks before running it.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [windows]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # The engines' C++ takes a quarter of an hour: kept even when the app's own code then fails to build.
          cache-on-failure: true

      - run: npm ci

      # bindgen (whisper-rs-sys, llama-cpp-sys-2) reads the C headers with libclang, which the runner's LLVM has.
      - name: Build the installer
        run: npx tauri build --bundles nsis
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin

      - uses: actions/upload-artifact@v4
        with:
          name: ghost-md-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
