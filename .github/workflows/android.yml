# Ghost.md for Android: the Flutter app's APK, built on a Linux runner from every push to main, and by hand (Run
# workflow). Matt, 2026-10-17: "kick off a CI process ... to build an APK from it".
#
# The steps are the ones a release on the Mac takes (tool/build-native.sh android, then flutter build apk), with what
# the Mac has set up done here first: the NDK the script asks for (28.2, Flutter's), Rust's arm64 Android target, and
# Flutter itself. The core is built with its engines (whisper.cpp and llama.cpp over one ggml), as the phone's is;
# rust-cache keeps native/target between runs, so only the first pays the quarter of an hour CMake takes.
#
# Before the APK: `flutter analyze` (errors fail the run; warnings and infos are said and do not) and the tests that
# need no core (test/claude). After it, the APK as an artifact. It is the ordinary build, "Ghost Flutter"
# (com.mattssoftware.glyph.flutter), signed with the runner's debug key: it installs beside the real app, never over
# it, and is not what scripts/deploy-flutter-apk.mjs publishes.
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The NDK tool/build-native.sh looks for first (`$ANDROID_HOME/ndk/28.*`), the one Flutter's Gradle names.
      - name: Android NDK 28.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # The engines' C++ is the long part: kept even when the app's own code then fails to build.
          cache-on-failure: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter's version
        run: flutter --version

      - name: The core for the phone
        run: tool/build-native.sh android

      - run: flutter pub get

      # Each finding is said as an annotation on the run as well (file, line, words), where it can be read without the
      # log. It does not stop the APK: what does not compile stops the build below anyway.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings --no-pub > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^ *(error|warning) • ' analyze.txt | head -50 | while IFS= read -r line; do
            level=$(printf '%s' "$line" | sed -E 's/^ *(error|warning) • .*/\1/')
            words=$(printf '%s' "$line" | sed -E 's/^ *(error|warning) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/\2 (\6)/')
            file=$(printf '%s' "$line" | sed -E 's/^.* • ([^ ]+):([0-9]+):([0-9]+) • [^•]*$/\1/')
            at=$(printf '%s' "$line" | sed -E 's/^.* • ([^ ]+):([0-9]+):([0-9]+) • [^•]*$/\2/')
            echo "::$level file=$file,line=$at::$words"
          done
          exit $code

      - name: Tests that need no core
        id: tests
        continue-on-error: true
        run: |
          set +e
          flutter test test/claude --reporter expanded > tests.txt 2>&1
          code=$?
          cat tests.txt
          grep -E '\[E\]|Expected:|Actual:|Error:' tests.txt | head -30 | while IFS= read -r line; do echo "::error title=test/claude::$line"; done
          exit $code

      - name: Build the APK
        run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: ghost-flutter-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Analyze and tests passed
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "::error::analyze: ${{ steps.analyze.outcome }}, tests: ${{ steps.tests.outcome }} (the APK above was still built)"
          exit 1
