name: glacier
description: The Glacier UI kit in Flutter, ported one to one from @glacier/react and @glacier/tokens.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The kit's own tests hand a pill, a toast and a menu an icon to hold; nothing the kit draws is from it.
  lucide_icons_flutter: ^3.1.22

flutter:
  assets:
    - assets/css/tokens.css
