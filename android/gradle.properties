org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Every release and profile build is compiled with the native compiler's load optimiser off. Dart 3.13.5 (Flutter
# 3.47.6) hoists `carried.item.id` out of a loop past the `carried != null` that guards it, so the load is made of
# null and the next one of whatever lay there: a board's lane (lib/editor/boards/board_box.dart `_laneChildren`)
# ended the app with SIGSEGV the moment a board was opened, in every compiled build and in no debug one
# (found 2026-10-10 in the Mac's profile build; `--no-load_cse` built the same source sound). Costs a little
# speed. Take it away only with a compiler that is known to be mended, and open a board in a release build first.
extra-gen-snapshot-options=--no-load_cse
