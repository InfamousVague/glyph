<!-- Android's adaptive foreground: the same bullet at two thirds, because the launcher shows only the middle 72 of the layer's 108 dp. Well inside the 66 dp circle a round mask keeps. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(512 512) scale(0.6667) translate(-512 -512)">
    <circle cx="349" cy="512" r="124" fill="#000000"/>
    <rect x="503" y="464" width="296" height="96" rx="48" fill="#000000"/>
  </g>
</svg>
