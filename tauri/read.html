<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- A published site is this page at /s/<id>/<page> (src/read/site.ts): its scripts and styles are named from the
         root, as they are at /read.html, and not from that page's own folder. -->
    <script>
      if (/^\/s\//.test(location.pathname)) document.write('<base href="/" />');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- A shared note or book is read here, and nobody else can: the key is after the # and never leaves the browser. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Ghost.md</title>
    <style>
      html { background: oklch(0.11 0 0); }
      html[data-theme='light'] { background: oklch(0.995 0 0); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/read/main.tsx"></script>
  </body>
</html>
