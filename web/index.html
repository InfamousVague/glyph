<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Ghost.md on the web (docs/WEB.md): the Flutter app compiled to WebAssembly, served at attack.fm/glyph/ by
    scripts/deploy-flutter-web.mjs. `flutter build web --base-href /glyph/` writes the base below.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ghost.md: notes in plain Markdown, the same on every device, encrypted before they leave it.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfdfd">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060606">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ghost.md">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Ghost.md</title>
  <style>
    /* The app's paper (assets/css/ink.css --app-gray-1) under the page before the first frame, so a dark phone
       never flashes white while the WebAssembly loads. */
    html, body { margin: 0; height: 100%; background: oklch(0.995 0 0); }
    @media (prefers-color-scheme: dark) { html, body { background: oklch(0.11 0 0); } }
  </style>
</head>
<body>
  <noscript>Ghost.md needs JavaScript and WebAssembly to run in a browser. The apps for Android, iPhone and the Mac
    are at https://ghostmarkdown.com.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
